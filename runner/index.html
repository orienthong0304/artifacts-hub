<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Artifacts Runner</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #ffffff;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      .artifact-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6e6b64;
        font-size: 13px;
        font-family: -apple-system, 'PingFang SC', 'Segoe UI', 'Microsoft YaHei', sans-serif;
        user-select: none;
      }
      #badge {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(26, 25, 21, 0.9);
        color: #faf9f5;
        font-size: 12px;
        font-family: -apple-system, 'PingFang SC', 'Segoe UI', 'Microsoft YaHei', sans-serif;
        text-decoration: none;
        opacity: 0.85;
        transition: opacity 0.15s ease;
      }
      #badge:hover {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="placeholder">等待渲染指令…</div>
    </div>
    <a
      id="badge"
      href="https://artifacts.orienthong.cn/?utm_source=badge"
      target="_blank"
      rel="noopener noreferrer"
      hidden
    >⚡ 用 Artifacts 制作</a>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
