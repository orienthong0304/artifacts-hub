# Artifacts 自托管全栈（README「快速开始」）：db + api + web + runner 一键起
#
# 默认形态 = 单用户实例（AUTH_MODE=single + MODERATION_MODE=off）：
# 首个注册者即管理员，此后注册关闭；不做内容审核，自己对自己的内容负责。
# 多用户公开实例请改 .env 里的两个模式变量并阅读 README「部署模式」。
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artifacts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artifacts}
      POSTGRES_DB: artifacts_platform
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U artifacts -d artifacts_platform']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://artifacts:${POSTGRES_PASSWORD:-artifacts}@db:5432/artifacts_platform
      JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET}
      AUTH_MODE: ${AUTH_MODE:-single}
      MODERATION_MODE: ${MODERATION_MODE:-off}
      RUNNER_ORIGIN: ${RUNNER_ORIGIN:-http://localhost:8081}
      SITES_DOMAIN_SUFFIX: ${SITES_DOMAIN_SUFFIX:-localhost}
      SITES_ROOT: /app/sites
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      ICP_NUMBER: ${ICP_NUMBER:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      ALIYUN_AK_ID: ${ALIYUN_AK_ID:-}
      ALIYUN_AK_SECRET: ${ALIYUN_AK_SECRET:-}
    volumes:
      - sites-data:/app/sites
    ports:
      - '127.0.0.1:8091:8091'

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_RUNNER_ORIGIN: ${RUNNER_ORIGIN:-http://localhost:8081}
        VITE_SITE_ORIGIN: ${SITE_ORIGIN:-http://localhost:8080}
        VITE_SITES_DOMAIN_SUFFIX: ${SITES_DOMAIN_SUFFIX:-localhost}
        VITE_OPERATOR_NAME: ${OPERATOR_NAME:-}
        VITE_ICP_NUMBER: ${ICP_NUMBER:-}
        VITE_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    depends_on:
      - api
    ports:
      - '8080:80'

  runner:
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
      args:
        # 允许嵌入 runner 的主域（不带协议）——与你的主站域名一致，换域必改
        VITE_MAIN_HOST: ${MAIN_HOST:-localhost}
    ports:
      - '8081:80'

  # 集成测试库（开发用，不随 up 启动）：cd server && npm run test:integration
  test-db:
    image: postgres:16-alpine
    profiles: ['dev']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: artifacts_platform_test
    ports:
      - '127.0.0.1:5433:5432'

volumes:
  db-data:
  sites-data:
