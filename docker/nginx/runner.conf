server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # opaque-origin iframe 的模块加载走 CORS：所有资源必须允许任意来源读取
  add_header Access-Control-Allow-Origin * always;
  # 谁能把 runner 嵌进 iframe 由应用层白名单（host-allow.ts）与此处双重限制；
  # 换域部署请把 localhost 换成你的主域（含子域通配）
  # add_header Content-Security-Policy "frame-ancestors 'self' https://你的域名 https://*.你的域名" always;

  location /vendor/ {
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
