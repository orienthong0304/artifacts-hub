<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 基本 Meta 标签 -->
    <title>Artifacts — 把 AI 生成的页面，变成可分享的作品</title>
    <meta name="description" content="Artifacts：粘贴 Claude / AI 生成的 React 或 HTML 代码，立刻得到可渲染、可分享的在线页面。" />

    <link rel="dns-prefetch" href="https://run.artifacts.orienthong.cn" />

    <!-- Open Graph Meta 标签 -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://artifacts.orienthong.cn/" />
    <meta property="og:title" content="Artifacts — 把 AI 生成的页面，变成可分享的作品" />

    <meta property="og:image" content="https://artifacts.orienthong.cn/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
